name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install --pre "muscles>=1.0.0rc1,<2.0.0"
      - run: python -m pip install "watchdog>=4,<5" "dnspython==2.6.1" pyyaml "werkzeug==2.1.1" "jsonschema>=4.18,<5" pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: PYTHONPATH=.:src python -m pytest --import-mode=importlib -q
      - run: python -m build --wheel --sdist
