[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "muscles-cli"
version = "1.0.0"
description = "Muscles CLI runtime for shared command routing and strategy execution"
readme = "README.md"
authors = ["Denis B. <denis@butko.info>"]
license = "MIT"
packages = [{include = "muscles", from = "src"}]


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
muscles = ">=1.0.0rc1,<2.0.0"
watchdog = "^4.0.0"
dnspython = "==2.6.1"
pyyaml = "~=6.0.0"
werkzeug = "==2.1.1"
greenlet = "==3.0.2"
jsonschema = "==4.16.0"


[tool.poetry.dev-dependencies]
pytest = "==7.1.3"
setuptools = "==69.0.2"

[tool.poetry.scripts]
muscles = "muscles.cli.tooling:main"
